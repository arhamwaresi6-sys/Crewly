{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block body_class %}notifications-page{% endblock %}
{% block content %}
<main class="main">
  <div class="page-head notification-heading">
    <div>
      <h1>Notifications</h1>
      <p class="muted">A simple place to catch up on your updates.</p>
    </div>
    <a class="btn btn-ghost" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
  </div>
  <section
    class="notification-list"
    id="notification-list"
    aria-live="polite"
    aria-label="All notifications"
  ></section>
</main>
{% endblock %}
